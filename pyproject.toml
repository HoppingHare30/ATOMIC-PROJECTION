[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice-generator"
version = "0.1.0"
description = "Projection and bicrystal analysis of FCC and BCC lattices"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "PySide6>=6.6",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "hypothesis>=6.100",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lattice_generator*"]
